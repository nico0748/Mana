server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginxバージョン番号をレスポンスヘッダーから除去
    server_tokens off;

    # ────────────────────────────────────────────────────────────────────
    # Content-Security-Policy
    # ────────────────────────────────────────────────────────────────────
    # XSS の二段ガード。Markdown レンダリングや URL バリデーションが破られた
    # ときでも、許可していないオリジンへの fetch / 不明な script のロードを
    # ブラウザ側で物理的に止める。
    #
    # 取り扱い注意:
    # - 'unsafe-inline' (script / style) は Vite SPA + Tailwind + framer-motion
    #   の制約により当面残す。将来的には index.html の gtag インラインスクリプト
    #   を外出しして sha256 ハッシュへ移行する余地あり。
    # - 新しい外部サービスを追加するたびに該当ディレクティブの allowlist 更新が必要。
    # - Nginx は add_header を子ブロックで上書きすると親の add_header が無効になるため、
    #   実際に CSP を効かせたい HTML レスポンス側 (server scope + /index.html location)
    #   の双方に書く必要がある。
    set $csp_policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://cover.openbd.jp https://books.google.com https://*.googleusercontent.com https://thumbnail.image.rakuten.co.jp https://shop.r10s.jp; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://www.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://ndlsearch.ndl.go.jp https://api.openbd.jp; frame-src https://checkout.stripe.com https://billing.stripe.com https://docs.google.com https://*.firebaseapp.com; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests";

    # セキュリティヘッダー
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   $csp_policy always;

    # Cloudflare 経由の実クライアント IP を取得
    # ホスト側 Nginx が CF-Connecting-IP → X-Real-IP として転送することを前提とする
    real_ip_header X-Real-IP;

    # index.html はキャッシュさせない（SPAのエントリポイント）
    # Nginx は location 内に add_header を書くと親 server の add_header を引き継がないので、
    # SPA のエントリポイントには CSP を含むセキュリティヘッダー全部を明示する。
    location = /index.html {
        add_header Cache-Control          "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        DENY always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy $csp_policy always;
    }

    # Vite がビルド時にハッシュ付きファイル名を生成する /assets/ は長期キャッシュ可
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # public/ に置いた画像など（ハッシュなし）は短期キャッシュ
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # .mjs を JavaScript として配信
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Cloudflare が付与する実 IP ヘッダーをバックエンドへ転送
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        client_max_body_size 60m;
    }

    # SPA fallback: all non-asset routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
