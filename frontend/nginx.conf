server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nginxバージョン番号をレスポンスヘッダーから除去
    server_tokens off;

    # セキュリティヘッダー
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Cloudflare 経由の実クライアント IP を取得
    # ホスト側 Nginx が CF-Connecting-IP → X-Real-IP として転送することを前提とする
    real_ip_header X-Real-IP;

    # index.html はキャッシュさせない（SPAのエントリポイント）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        DENY always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
    }

    # Vite がビルド時にハッシュ付きファイル名を生成する /assets/ は長期キャッシュ可
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # public/ に置いた画像など（ハッシュなし）は短期キャッシュ
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # .mjs を JavaScript として配信
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Cloudflare が付与する実 IP ヘッダーをバックエンドへ転送
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        client_max_body_size 60m;
    }

    # SPA fallback: all non-asset routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
}
