name: Deploy to VPS

# 本番は Vercel（main への push で自動デプロイ）に移行したため、
# VPS へのデプロイは手動実行のときだけ走らせる。
on:
  workflow_dispatch:

jobs:
  deploy:
    name: SSH デプロイ
    runs-on: ubuntu-latest

    steps:
      - name: VPS にSSH接続してデプロイ
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/doujin-pp
            bash deploy.sh
